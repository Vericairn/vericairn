name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue's event. Every job runs for a queued group exactly as for a pull request, so each check the default
  # branch requires reports on the commit the queue would move main to.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit on a pull request cancels that pull request's run still in progress: no merge can use the head it tests.
# Every other run, a push to main, a merge queue group or a manual run, has a group of its own, so none is ever cancelled or
# held back by another. The jobs package.yml runs for this workflow belong to this run and stop with it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pull-request-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A second line behind tools/BuildTelemetry.targets: Avalonia's build statistics stay off in every job.
  AVALONIA_TELEMETRY_OPTOUT: "1"

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workflow action allow-list and full commit pins
        run: ruby .github/scripts/check-workflow-actions.rb
      - name: Test workflow policy and package verification
        run: |
          ruby .github/scripts/test-workflow-actions.rb
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  # Remote's heads build only where their platform's workload is installed, so they are in src/Vericairn.Mobile.slnx, not the
  # solution build-test builds. The workload set is pinned so CI builds with the SDKs the heads were built with. These are
  # developer builds: neither job signs, installs on or qualifies a real device. The workloads are installed afresh on every
  # run, uncached: an install takes 15 to 30 seconds, and a cache would have to restore packs and installation records into
  # the SDK's own directory, where the SDK trusts whatever it finds. Each head's NuGet packages are cached on the SDK pin,
  # every lock file and this workflow, which pins the workload set whose runtime packs a restore downloads beside the locked
  # graph.
  remote-ios:
    # iOS alone is pinned to workload set 10.0.401 (iOS 26.5, Xcode 26.6): Avalonia.iOS does not build against the iOS 27.1
    # bindings of the band's later sets yet. The phone head is a developer build, not a release artifact: that set's Mono
    # runtime (10.0.12) ships in no release, and the distributables embed the SDK's own runtime.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        timeout-minutes: 10
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages.lock.json
            .github/workflows/ci.yml
      - name: Install the iOS workload
        timeout-minutes: 10
        run: dotnet workload install ios --version 10.0.401
      - name: Select Xcode
        # The pinned iOS workload (26.5) requires Xcode 26.6, and its build finds tools through the macOS SDK.
        run: |
          set -eu
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          ls "$(xcode-select -p)/Platforms/MacOSX.platform/Developer/SDKs" "$(xcode-select -p)/Platforms/iPhoneSimulator.platform/Developer/SDKs"
          xcrun --sdk macosx --show-sdk-path
      - name: Restore (locked)
        timeout-minutes: 10
        run: dotnet restore src/Vericairn.Remote.iOS/Vericairn.Remote.iOS.csproj --locked-mode
      - name: Build Remote for the iOS simulator
        run: dotnet build src/Vericairn.Remote.iOS/Vericairn.Remote.iOS.csproj --no-restore --configuration Release

  remote-android:
    # Android follows the SDK's patch: workload set 10.0.404 carries the Mono runtime 10.0.15 that the phone head embeds.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        timeout-minutes: 10
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            **/packages.lock.json
            .github/workflows/ci.yml
      - name: Install the Android workload
        timeout-minutes: 10
        run: dotnet workload install android --version 10.0.404
      - name: Restore (locked)
        timeout-minutes: 10
        run: dotnet restore src/Vericairn.Remote.Android/Vericairn.Remote.Android.csproj --locked-mode
      - name: Build Remote for Android
        # The runner image provides the Android SDK, its licenses accepted by the image, and JDK 17.
        run: >-
          dotnet build src/Vericairn.Remote.Android/Vericairn.Remote.Android.csproj --no-restore --configuration Release
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME_17_X64"

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        share: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        timeout-minutes: 10
        with:
          global-json-file: global.json
          # The NuGet global packages folder is restored only on an exact match of this key, the runner's operating system and
          # the hash of the SDK pin and every lock file, and saved only after the job succeeds; there are no partial matches.
          # The locked restore still compares every package's SHA-512 with its lock file, a cached package's being the hash
          # NuGet recorded when a successful run downloaded it. Build output is never cached, and the local feed check below
          # keeps an empty source list and a fresh cache of its own.
          cache: true
          cache-dependency-path: |
            global.json
            **/packages.lock.json
      - name: Restore (locked)
        timeout-minutes: 10
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Verify retained companion inputs and bytes
        if: matrix.share == 1
        run: python tests/companion-build.py
      - name: Build the Secure Enclave helper
        # The helper is Swift and builds on macOS only. The Apple-silicon runners expose a Secure Enclave to it, so the store's
        # test creates, signs with and removes a real enclave key there (one without presence, so nothing waits for a person).
        if: runner.os == 'macOS'
        run: |
          set -eu
          mkdir -p artifacts/enclave
          swiftc -O -o artifacts/enclave/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          artifacts/enclave/vericairn-enclave available || test $? -eq 3
          echo "VERICAIRN_ENCLAVE_HELPER=$PWD/artifacts/enclave/vericairn-enclave" >> "$GITHUB_ENV"
      - name: Install a secret service
        timeout-minutes: 10
        # Linux custody uses the secret service where one runs, and the runner has none: GNOME Keyring and secret-tool are
        # installed, and the Linux tests run in a D-Bus session with a keyring unlocked by a throwaway password.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring libsecret-tools dbus-daemon
      - name: Install gitleaks for the scanner's tests
        timeout-minutes: 10
        # The release secret-scan.yml installs, pinned by version and by the SHA-256 that its checksums file gives for the Linux
        # archive. The secret scan's tests then scan real commits with Vericairn's configuration; elsewhere they are skipped.
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "VERICAIRN_TEST_GITLEAKS=$dir/gitleaks" >> "$GITHUB_ENV"
      - name: Test
        if: runner.os != 'Linux'
        # Each failed test is retried once and reported in the run's summary; a second failure fails the job.
        run: python .github/scripts/run-tests.py --share ${{ matrix.share }}
      - name: Test, with a secret service
        if: runner.os == 'Linux'
        env:
          VERICAIRN_EXPECT_SECRET_SERVICE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -eu
            printf throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            printf probe | secret-tool store --label "Vericairn CI probe" application vericairn-ci probe 1
            test "$(secret-tool lookup application vericairn-ci probe 1)" = probe
            python3 .github/scripts/run-tests.py --share ${{ matrix.share }}'
      - name: Measure history checkpoints at 100,000 records
        if: matrix.share == 1
        # The signed history design's section 11 cost test, on each platform beside the suites rather than in their time budget:
        # the inventory's size, the adoption's objects and what verifying checkpoints adds, written to this step's log.
        env:
          VERICAIRN_COST_TESTS: "1"
        run: dotnet artifacts/bin/Vericairn.Records.Tests/release/Vericairn.Records.Tests.dll --filter-class Vericairn.Records.Tests.HistoryCostTests --show-live-output on
      - name: Smoke the CLI
        if: matrix.share == 1
        run: dotnet run --no-build --configuration Release --project src/Vericairn.Cli -- records describe
      - name: Pack the Community packages
        if: matrix.share == 1
        run: dotnet pack --no-build --configuration Release --output "${{ runner.temp }}/nuget"
      - name: Install the tool and SDK from the local feed
        timeout-minutes: 10
        if: matrix.share == 1
        shell: python
        # The same check runs on every platform. An empty source list and a fresh cache make the local
        # packages the only possible source; no published package can hide a missing dependency.
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          feed = Path(os.environ["RUNNER_TEMP"]) / "nuget"
          [tool] = feed.glob("dotnet-vc.*.nupkg")
          version = tool.name.removeprefix("dotnet-vc.").removesuffix(".nupkg")

          def dotnet(*args):
              subprocess.run(["dotnet", *map(str, args)], check=True)

          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              scratch = Path(temporary)
              config = scratch / "NuGet.Config"
              config.write_text('<configuration><packageSources><clear /></packageSources></configuration>')
              os.environ["NUGET_PACKAGES"] = str(scratch / "cache")
              tool_path = scratch / "tools"
              dotnet("tool", "install", "dotnet-vc", "--version", version, "--tool-path", tool_path,
                     "--add-source", feed, "--configfile", config)
              os.environ["PATH"] = str(tool_path) + os.pathsep + os.environ["PATH"]
              dotnet("vc", "version")
              dotnet("vc", "doctor")

              project = scratch / "consumer"
              dotnet("new", "console", "--framework", "net10.0", "--output", project, "--no-restore")
              (project / "Program.cs").write_text('''using Vericairn.Protocol;
          using Vericairn.Records.Hashing;
          using Vericairn.Sdk;
          Console.WriteLine(typeof(VericairnClient).FullName);
          Console.WriteLine(typeof(IEstateApi).FullName);
          Console.WriteLine(typeof(ContentHash).FullName);
          ''')
              dotnet("add", project, "package", "Vericairn", "--version", version, "--no-restore")
              dotnet("restore", project, "--source", feed, "--configfile", config, "-p:NuGetAudit=false")
              dotnet("build", project, "--no-restore", "--configuration", "Release")

  package:
    # The release's packaging path on every change, everything but the draft: release.yml runs the same package.yml. It runs
    # beside the tests rather than after them, so it adds no time to the run's critical path.
    uses: ./.github/workflows/package.yml
    with:
      release: false
