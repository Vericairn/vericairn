name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    # Pull requests build on Linux; merges to main and manual runs cover all three platforms,
    # which keeps the private repository inside its included Actions minutes.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Build the Secure Enclave helper
        # The helper is Swift and builds on macOS only. The Apple-silicon runners expose a Secure Enclave to it, so the store's
        # test creates, signs with and removes a real enclave key there (one without presence, so nothing waits for a person).
        if: runner.os == 'macOS'
        run: |
          set -eu
          mkdir -p artifacts/enclave
          swiftc -O -o artifacts/enclave/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          artifacts/enclave/vericairn-enclave available || test $? -eq 3
          echo "VERICAIRN_ENCLAVE_HELPER=$PWD/artifacts/enclave/vericairn-enclave" >> "$GITHUB_ENV"
      - name: Install a secret service
        # Linux custody uses the secret service where one runs, and the runner has none: GNOME Keyring and secret-tool are
        # installed, and the Linux tests run in a D-Bus session with a keyring unlocked by a throwaway password.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring libsecret-tools dbus-daemon
      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test --no-build --configuration Release
      - name: Test, with a secret service
        if: runner.os == 'Linux'
        env:
          VERICAIRN_EXPECT_SECRET_SERVICE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -eu
            printf throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            printf probe | secret-tool store --label "Vericairn CI probe" application vericairn-ci probe 1
            test "$(secret-tool lookup application vericairn-ci probe 1)" = probe
            dotnet test --no-build --configuration Release'
      - name: Smoke the CLI
        run: dotnet run --no-build --configuration Release --project src/Vericairn.Cli -- records describe

  secret-scan:
    # The estate's repository map asks for a secret scan before every push to a public repository (rule 6). This job scans
    # the commits each push to main, pull request and manual run brings, and fails on any finding, every secret redacted
    # from the log; it runs beside build-test, so its result shows on its own. It runs gitleaks' own release, pinned by
    # version and by the SHA-256 that the release's checksums file gives for the Linux archive, rather than
    # gitleaks-action, which needs a license key for an organization, and it uses no secret.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # gitleaks_8.30.1_linux_x64.tar.gz, as gitleaks_8.30.1_checksums.txt of the release lists it.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The whole history, so the event's range can be read; no token is left in the clone the scanner reads.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" version
      - name: Scan the commits this event brings
        # A pull request's commits; a push's range, or the whole history when the commit the push replaced is not in the
        # clone (a first push, or one that rewrote the branch); the whole history for a manual run. gitleaks reports no
        # leaks when git cannot read its range, so the range is counted first: an unreadable or empty one fails here.
        # gitleaks takes a .gitleaks.toml and a .gitleaksignore from the directory it scans and from its ignore path, and
        # honors gitleaks:allow comments, all of which the scanned commits could carry; so it scans the git directory,
        # where neither file can be committed, with an ignore path that holds none, and ignores those comments. A finding
        # is classified in the estate, never silenced here.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) if git cat-file -e "$PUSH_BEFORE^{commit}" 2> /dev/null; then range="$PUSH_BEFORE..$PUSH_AFTER"; else range=--all; fi ;;
            *) range=--all ;;
          esac
          count=$(git rev-list --count "$range")
          if [ "$count" -eq 0 ]; then
            echo "$range holds no commits, so the scan would read nothing." >&2
            exit 1
          fi
          echo "Scanning $count commits: $range"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source .git --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks" --ignore-gitleaks-allow \
            --redact --verbose --no-banner --log-opts="$range"
