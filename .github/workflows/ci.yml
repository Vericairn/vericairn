name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    # Pull requests build on Linux; merges to main and manual runs cover all three platforms,
    # which keeps the private repository inside its included Actions minutes.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Build the Secure Enclave helper
        # The helper is Swift and builds on macOS only. The Apple-silicon runners expose a Secure Enclave to it, so the store's
        # test creates, signs with and removes a real enclave key there (one without presence, so nothing waits for a person).
        if: runner.os == 'macOS'
        run: |
          set -eu
          mkdir -p artifacts/enclave
          swiftc -O -o artifacts/enclave/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          artifacts/enclave/vericairn-enclave available || test $? -eq 3
          echo "VERICAIRN_ENCLAVE_HELPER=$PWD/artifacts/enclave/vericairn-enclave" >> "$GITHUB_ENV"
      - name: Install a secret service
        # Linux custody uses the secret service where one runs, and the runner has none: GNOME Keyring and secret-tool are
        # installed, and the Linux tests run in a D-Bus session with a keyring unlocked by a throwaway password.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring libsecret-tools dbus-daemon
      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test --no-build --configuration Release
      - name: Test, with a secret service
        if: runner.os == 'Linux'
        env:
          VERICAIRN_EXPECT_SECRET_SERVICE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -eu
            printf throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            printf probe | secret-tool store --label "Vericairn CI probe" application vericairn-ci probe 1
            test "$(secret-tool lookup application vericairn-ci probe 1)" = probe
            dotnet test --no-build --configuration Release'
      - name: Smoke the CLI
        run: dotnet run --no-build --configuration Release --project src/Vericairn.Cli -- records describe
