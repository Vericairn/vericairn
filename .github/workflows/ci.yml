name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the workflow action allow-list and full commit pins
        run: ruby .github/scripts/check-workflow-actions.rb
      - name: Test workflow policy and package verification
        run: |
          ruby .github/scripts/test-workflow-actions.rb
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        share: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        timeout-minutes: 10
        with:
          global-json-file: global.json
      - name: Restore (locked)
        timeout-minutes: 10
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Verify retained companion inputs and bytes
        if: matrix.share == 1
        run: python tests/companion-build.py
      - name: Build the Secure Enclave helper
        # The helper is Swift and builds on macOS only. The Apple-silicon runners expose a Secure Enclave to it, so the store's
        # test creates, signs with and removes a real enclave key there (one without presence, so nothing waits for a person).
        if: runner.os == 'macOS'
        run: |
          set -eu
          mkdir -p artifacts/enclave
          swiftc -O -o artifacts/enclave/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          artifacts/enclave/vericairn-enclave available || test $? -eq 3
          echo "VERICAIRN_ENCLAVE_HELPER=$PWD/artifacts/enclave/vericairn-enclave" >> "$GITHUB_ENV"
      - name: Install a secret service
        timeout-minutes: 10
        # Linux custody uses the secret service where one runs, and the runner has none: GNOME Keyring and secret-tool are
        # installed, and the Linux tests run in a D-Bus session with a keyring unlocked by a throwaway password.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring libsecret-tools dbus-daemon
      - name: Install gitleaks for the scanner's tests
        timeout-minutes: 10
        # The release secret-scan.yml installs, pinned by version and by the SHA-256 that its checksums file gives for the Linux
        # archive. The secret scan's tests then scan real commits with Vericairn's configuration; elsewhere they are skipped.
        if: runner.os == 'Linux'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "VERICAIRN_TEST_GITLEAKS=$dir/gitleaks" >> "$GITHUB_ENV"
      - name: Test
        if: runner.os != 'Linux'
        # Each failed test is retried once and reported in the run's summary; a second failure fails the job.
        run: python .github/scripts/run-tests.py --share ${{ matrix.share }}
      - name: Test, with a secret service
        if: runner.os == 'Linux'
        env:
          VERICAIRN_EXPECT_SECRET_SERVICE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -eu
            printf throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            printf probe | secret-tool store --label "Vericairn CI probe" application vericairn-ci probe 1
            test "$(secret-tool lookup application vericairn-ci probe 1)" = probe
            python3 .github/scripts/run-tests.py --share ${{ matrix.share }}'
      - name: Smoke the CLI
        if: matrix.share == 1
        run: dotnet run --no-build --configuration Release --project src/Vericairn.Cli -- records describe
      - name: Pack the Community packages
        if: matrix.share == 1
        run: dotnet pack --no-build --configuration Release --output "${{ runner.temp }}/nuget"
      - name: Install the tool and SDK from the local feed
        timeout-minutes: 10
        if: matrix.share == 1
        shell: python
        # The same check runs on every platform. An empty source list and a fresh cache make the local
        # packages the only possible source; no published package can hide a missing dependency.
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          feed = Path(os.environ["RUNNER_TEMP"]) / "nuget"
          [tool] = feed.glob("dotnet-vc.*.nupkg")
          version = tool.name.removeprefix("dotnet-vc.").removesuffix(".nupkg")

          def dotnet(*args):
              subprocess.run(["dotnet", *map(str, args)], check=True)

          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              scratch = Path(temporary)
              config = scratch / "NuGet.Config"
              config.write_text('<configuration><packageSources><clear /></packageSources></configuration>')
              os.environ["NUGET_PACKAGES"] = str(scratch / "cache")
              tool_path = scratch / "tools"
              dotnet("tool", "install", "dotnet-vc", "--version", version, "--tool-path", tool_path,
                     "--add-source", feed, "--configfile", config)
              os.environ["PATH"] = str(tool_path) + os.pathsep + os.environ["PATH"]
              dotnet("vc", "version")
              dotnet("vc", "doctor")

              project = scratch / "consumer"
              dotnet("new", "console", "--framework", "net10.0", "--output", project, "--no-restore")
              (project / "Program.cs").write_text('''using Vericairn.Protocol;
          using Vericairn.Records.Hashing;
          using Vericairn.Sdk;
          Console.WriteLine(typeof(VericairnClient).FullName);
          Console.WriteLine(typeof(IEstateApi).FullName);
          Console.WriteLine(typeof(ContentHash).FullName);
          ''')
              dotnet("add", project, "package", "Vericairn", "--version", version, "--no-restore")
              dotnet("restore", project, "--source", feed, "--configfile", config, "-p:NuGetAudit=false")
              dotnet("build", project, "--no-restore", "--configuration", "Release")

  package:
    # The release's packaging path on every change, everything but the draft: release.yml runs the same package.yml. It runs
    # beside the tests rather than after them, so it adds no time to the run's critical path.
    uses: ./.github/workflows/package.yml
    with:
      release: false
