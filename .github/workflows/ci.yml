name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Build the Secure Enclave helper
        # The helper is Swift and builds on macOS only. The Apple-silicon runners expose a Secure Enclave to it, so the store's
        # test creates, signs with and removes a real enclave key there (one without presence, so nothing waits for a person).
        if: runner.os == 'macOS'
        run: |
          set -eu
          mkdir -p artifacts/enclave
          swiftc -O -o artifacts/enclave/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          artifacts/enclave/vericairn-enclave available || test $? -eq 3
          echo "VERICAIRN_ENCLAVE_HELPER=$PWD/artifacts/enclave/vericairn-enclave" >> "$GITHUB_ENV"
      - name: Install a secret service
        # Linux custody uses the secret service where one runs, and the runner has none: GNOME Keyring and secret-tool are
        # installed, and the Linux tests run in a D-Bus session with a keyring unlocked by a throwaway password.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring libsecret-tools dbus-daemon
      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test --no-build --configuration Release
      - name: Test, with a secret service
        if: runner.os == 'Linux'
        env:
          VERICAIRN_EXPECT_SECRET_SERVICE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -eu
            printf throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            printf probe | secret-tool store --label "Vericairn CI probe" application vericairn-ci probe 1
            test "$(secret-tool lookup application vericairn-ci probe 1)" = probe
            dotnet test --no-build --configuration Release'
      - name: Smoke the CLI
        run: dotnet run --no-build --configuration Release --project src/Vericairn.Cli -- records describe
      - name: Pack the Community packages
        run: dotnet pack --no-build --configuration Release --output "${{ runner.temp }}/nuget"
      - name: Install the tool and SDK from the local feed
        shell: python
        # The same check runs on every platform. An empty source list and a fresh cache make the local
        # packages the only possible source; no published package can hide a missing dependency.
        run: |
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          feed = Path(os.environ["RUNNER_TEMP"]) / "nuget"
          [tool] = feed.glob("dotnet-vc.*.nupkg")
          version = tool.name.removeprefix("dotnet-vc.").removesuffix(".nupkg")

          def dotnet(*args):
              subprocess.run(["dotnet", *map(str, args)], check=True)

          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as temporary:
              scratch = Path(temporary)
              config = scratch / "NuGet.Config"
              config.write_text('<configuration><packageSources><clear /></packageSources></configuration>')
              os.environ["NUGET_PACKAGES"] = str(scratch / "cache")
              tool_path = scratch / "tools"
              dotnet("tool", "install", "dotnet-vc", "--version", version, "--tool-path", tool_path,
                     "--add-source", feed, "--configfile", config)
              os.environ["PATH"] = str(tool_path) + os.pathsep + os.environ["PATH"]
              dotnet("vc", "version")
              dotnet("vc", "doctor")

              project = scratch / "consumer"
              dotnet("new", "console", "--framework", "net10.0", "--output", project, "--no-restore")
              (project / "Program.cs").write_text('''using Vericairn.Protocol;
          using Vericairn.Records.Hashing;
          using Vericairn.Sdk;
          Console.WriteLine(typeof(VericairnClient).FullName);
          Console.WriteLine(typeof(IEstateApi).FullName);
          Console.WriteLine(typeof(ContentHash).FullName);
          ''')
              dotnet("add", project, "package", "Vericairn", "--version", version, "--no-restore")
              dotnet("restore", project, "--source", feed, "--configfile", config, "-p:NuGetAudit=false")
              dotnet("build", project, "--no-restore", "--configuration", "Release")
