name: nuget

# A candidate may be withdrawn. Only the operator's publication releases its exact package assets.
# A person may also name a published, immutable release by its id, when its release event could not run this
# workflow; that run pushes exactly the same verified assets, and a version nuget.org already holds is skipped.
#
# It has no pull-request trigger: package.yml packs and verifies the packages on every change, and a job skipped on every pull
# request would be a check that never passes, which a checked merge refuses.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_id:
        description: The id of a published, immutable release whose package assets to push.
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download the published release's packages and checksums
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id || inputs.release_id }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        # Address the release by its id, the event's or the one a person names, so a moved or reused tag cannot select another release.
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          repository = os.environ["GH_REPO"]
          release_id = int(os.environ["RELEASE_ID"])
          release = json.loads(subprocess.check_output(["gh", "api", f"repos/{repository}/releases/{release_id}"]))
          if release["id"] != release_id or release["draft"] or not release["published_at"]:
              raise SystemExit("The release is not published.")
          # A named release must be immutable, so its assets are exactly those its publication released.
          if os.environ["DISPATCHED"] == "true" and release.get("immutable") is not True:
              raise SystemExit("A dispatched run pushes only a published, immutable release.")
          assets = [asset for asset in release["assets"]
                    if asset["name"] == "SHA256SUMS" or asset["name"].endswith((".nupkg", ".snupkg"))]
          names = [asset["name"] for asset in assets]
          if "SHA256SUMS" not in names or len(names) != len(set(names)):
              raise SystemExit("Missing checksums or duplicate asset names.")
          directory = Path("packages")
          directory.mkdir()
          for asset in assets:
              name = asset["name"]
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name):
                  raise SystemExit(f"Unsafe asset name: {name}")
              with (directory / name).open("xb") as output:
                  subprocess.run(["gh", "api", f"repos/{repository}/releases/assets/{asset['id']}",
                                  "--header", "Accept: application/octet-stream"], stdout=output, check=True)
      - name: Verify every package against SHA256SUMS
        shell: bash
        run: |
          python3 .github/scripts/verify-packages.py packages
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push the verified packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # Suppress the implicit symbol push so each verified file is sent explicitly. A version nuget.org already holds is skipped,
        # never replaced, so a re-run completes a publication that stopped part way.
        run: |
          set -eu
          for package in packages/*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --no-symbols --skip-duplicate
          done
          for symbols in packages/*.snupkg; do
            dotnet nuget push "$symbols" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
