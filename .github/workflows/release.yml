name: release

# Builds a release candidate from an exact commit: the three-platform test matrix is the evidence, the
# distributables are self-contained per platform, a software bill of materials and the notices travel
# with them, and everything lands in a DRAFT GitHub release with a SHA256SUMS file. Publishing the draft
# is the operator's reserved action after the candidate is accepted in the estate.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal VersionPrefix in Directory.Build.props)
        required: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Test
        run: dotnet test --no-build --configuration Release

  package:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Check the version
        shell: bash
        run: |
          prefix=$(grep -o '<VersionPrefix>[^<]*' Directory.Build.props | sed 's/<VersionPrefix>//')
          if [ "$prefix" != "${{ inputs.version }}" ]; then
            echo "Directory.Build.props says $prefix, the release input says ${{ inputs.version }}" >&2
            exit 1
          fi
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Check the documentation set
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        # The release's documentation set must exist and cover every command, API operation and record type of this
        # build before any draft is created; an incomplete set refuses the release with every gap listed.
        run: dotnet run --configuration Release --project src/Vericairn.Cli -- docs check "docs/releases/$VERSION"
      - name: Publish self-contained distributables
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
            dotnet publish src/Vericairn.Cli/Vericairn.Cli.csproj --configuration Release --runtime "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:VersionSuffix= -p:ContinuousIntegrationBuild=true -p:RestoreLockedMode=false \
              --output "out/$rid/bin" --nologo --verbosity quiet
            rm -f "out/$rid/bin/"*.pdb "out/$rid/bin/"*.xml
            cp LICENSE NOTICE THIRD-PARTY-NOTICES.md "out/$rid/"
            case "$rid" in
              win-*) (cd "out/$rid" && zip -q -X -r "../../dist/vericairn-$VERSION-$rid.zip" .) ;;
              *) tar -C "out/$rid" -czf "dist/vericairn-$VERSION-$rid.tar.gz" . ;;
            esac
          done
          # Runtime-specific restores rewrite the lock files in the working tree; the repository's lock files are the truth.
          git checkout -- $(git ls-files '*packages.lock.json')
      - name: Publish Workbench distributables
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        # The desktop ships per platform as an unsigned developer build beside the command line it drives (Workbench finds
        # vericairn next to its own executable); no bundle, installer or signature yet, as the platform obligations record.
        run: |
          set -eu
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
            dotnet publish src/Vericairn.Workbench/Vericairn.Workbench.csproj --configuration Release --runtime "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:VersionSuffix= -p:ContinuousIntegrationBuild=true -p:RestoreLockedMode=false \
              --output "out-workbench/$rid/bin" --nologo --verbosity quiet
            rm -f "out-workbench/$rid/bin/"*.pdb "out-workbench/$rid/bin/"*.xml
            cp "out/$rid/bin/"vericairn* "out-workbench/$rid/bin/"
            cp LICENSE NOTICE THIRD-PARTY-NOTICES.md "out-workbench/$rid/"
            case "$rid" in
              win-*) (cd "out-workbench/$rid" && zip -q -X -r "../../dist/vericairn-workbench-$VERSION-$rid.zip" .) ;;
              *) tar -C "out-workbench/$rid" -czf "dist/vericairn-workbench-$VERSION-$rid.tar.gz" . ;;
            esac
          done
          git checkout -- $(git ls-files '*packages.lock.json')
      - name: Software bill of materials
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          dotnet tool install --global CycloneDX
          dotnet CycloneDX Vericairn.slnx --output sbom --json --exclude-test-projects
          cp sbom/bom.json "dist/vericairn-$VERSION-sbom.cdx.json"
          cp THIRD-PARTY-NOTICES.md "dist/vericairn-$VERSION-THIRD-PARTY-NOTICES.md"
      - name: Documentation set
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          (cd docs/releases && zip -q -X -r "../../dist/vericairn-$VERSION-docs.zip" "$VERSION")
      - name: Checksums and notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          {
            echo "Vericairn $VERSION (unsigned developer build)"
            echo
            echo "Commit: ${{ github.sha }}"
            echo "Evidence: workflow run ${{ github.run_id }} built and tested on ubuntu-latest, macos-latest and windows-latest."
            echo "Record format: reads 1, writes 1."
            echo "Signing: none yet; this is an unsigned developer build. Verify the SHA256SUMS against the estate's manifest, never against the tag alone."
            echo
            echo "Distributables are self-contained per platform: unpack and run bin/vericairn (bin/vericairn.exe on Windows)."
            echo "Workbench, the desktop, is vericairn-workbench-$VERSION-<platform>: unpack and run bin/vericairn-workbench beside the bin/vericairn it drives; an unsigned developer build with no bundle or installer, qualified only where the platform obligations say."
            echo
            echo "Documentation: vericairn-$VERSION-docs.zip is this release's documentation set (docs/releases/$VERSION in the repository): overview, installation and cold start, the operator's journeys, the command-line, API and record references, release notes and known limitations."
          } > dist/NOTES.md
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vericairn-${{ inputs.version }}
          path: dist
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        # Every asset is named once (a pattern that also matched the documentation archive once uploaded it twice and the
        # upload was refused). A draft of the same version left by an earlier failed run of this workflow is replaced, so
        # the observed draft is always the one this run built; a published release is never touched, and a corrective
        # release is a new version.
        run: |
          set -eu
          earlier=$(gh release view "v$VERSION" --json isDraft -q 'select(.isDraft) | "draft"' 2>/dev/null || true)
          if [ "$earlier" = "draft" ]; then
            echo "replacing the draft v$VERSION left by an earlier run of this workflow"
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft --title "Vericairn $VERSION" --notes-file dist/NOTES.md --target "${{ github.sha }}" \
            dist/vericairn-$VERSION-linux-x64.tar.gz dist/vericairn-$VERSION-linux-arm64.tar.gz dist/vericairn-$VERSION-osx-x64.tar.gz dist/vericairn-$VERSION-osx-arm64.tar.gz \
            dist/vericairn-$VERSION-win-x64.zip dist/vericairn-$VERSION-win-arm64.zip \
            dist/vericairn-workbench-$VERSION-linux-x64.tar.gz dist/vericairn-workbench-$VERSION-linux-arm64.tar.gz dist/vericairn-workbench-$VERSION-osx-x64.tar.gz dist/vericairn-workbench-$VERSION-osx-arm64.tar.gz \
            dist/vericairn-workbench-$VERSION-win-x64.zip dist/vericairn-workbench-$VERSION-win-arm64.zip \
            dist/vericairn-$VERSION-sbom.cdx.json dist/vericairn-$VERSION-THIRD-PARTY-NOTICES.md dist/vericairn-$VERSION-docs.zip dist/SHA256SUMS
