name: release

# Builds a release candidate from an exact commit: the three-platform test matrix is the evidence, the
# archives are self-contained per platform, NuGet packages are framework-dependent, and a software bill
# of materials and the notices travel with them. Everything lands in a DRAFT GitHub release under
# SHA256SUMS. Publishing the draft is the operator's reserved action after acceptance in the estate;
# only nuget.yml, triggered by that publication, pushes the package assets to NuGet.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal VersionPrefix in Directory.Build.props)
        required: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Verify retained companion inputs and bytes
        run: python tests/companion-build.py
      - name: Build the Secure Enclave helper
        # The release's own test run exercises real key custody on every platform it qualifies. Unlike continuous integration, it
        # requires the Apple-silicon runner's Secure Enclave: the helper must find one, and the enclave tests fail rather than skip
        # (VERICAIRN_EXPECT_ENCLAVE), so the run's success means the store's test made, signed with and removed a real enclave key
        # (one without presence, so nothing waits for a person).
        if: runner.os == 'macOS'
        run: |
          set -eu
          mkdir -p artifacts/enclave
          swiftc -O -o artifacts/enclave/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          artifacts/enclave/vericairn-enclave available
          echo "VERICAIRN_ENCLAVE_HELPER=$PWD/artifacts/enclave/vericairn-enclave" >> "$GITHUB_ENV"
          echo "VERICAIRN_EXPECT_ENCLAVE=1" >> "$GITHUB_ENV"
      - name: Install a secret service
        # GNOME Keyring and secret-tool, so the Linux tests run the secret-service store in a D-Bus session with a keyring
        # unlocked by a throwaway password.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring libsecret-tools dbus-daemon
      - name: Test
        if: runner.os != 'Linux'
        run: dotnet test --no-build --configuration Release
      - name: Test, with a secret service
        if: runner.os == 'Linux'
        env:
          VERICAIRN_EXPECT_SECRET_SERVICE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -eu
            printf throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            printf probe | secret-tool store --label "Vericairn release probe" application vericairn-ci probe 1
            test "$(secret-tool lookup application vericairn-ci probe 1)" = probe
            dotnet test --no-build --configuration Release'

  enclave-helper:
    # The Secure Enclave helper is Swift and builds on macOS only; the package job places it beside the macOS command line.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build vericairn-enclave for both Mac architectures
        run: |
          set -eu
          mkdir -p enclave/osx-arm64 enclave/osx-x64
          swiftc -O -target arm64-apple-macos13.0 -o enclave/osx-arm64/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          swiftc -O -target x86_64-apple-macos13.0 -o enclave/osx-x64/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          file enclave/osx-arm64/vericairn-enclave enclave/osx-x64/vericairn-enclave
      - name: Run the arm64 helper that ships
        # The verify job tests a helper it compiles for itself; this runs the binary the package job ships for Apple silicon: a key
        # made in the runner's Secure Enclave without presence, its public key read back, a digest signed, then the key discarded.
        run: |
          set -eu
          helper=enclave/osx-arm64/vericairn-enclave
          # The release requires the runner's Secure Enclave: a helper that finds none fails the run instead of passing silently.
          "$helper" available
          dir=$(mktemp -d)
          "$helper" create "$dir/key.blob" > "$dir/public.txt"
          test -s "$dir/public.txt"
          test "$(cat "$dir/public.txt")" = "$("$helper" public "$dir/key.blob")"
          digest=$(printf 'vericairn release smoke' | shasum -a 256 | cut -d' ' -f1)
          "$helper" sign "$dir/key.blob" "$digest" > "$dir/signature.txt"
          test -s "$dir/signature.txt"
          rm -rf "$dir"
          echo "the shipped helper made a Secure Enclave key, read its public key back and signed a digest with it"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: enclave-helper
          path: enclave
          retention-days: 1

  package:
    needs: [verify, enclave-helper]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The documentation comparison proves the release commit's build sources match the commit the set's
          # references were generated from, which a shallow clone lacks.
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Check the version
        shell: bash
        run: |
          prefix=$(grep -o '<VersionPrefix>[^<]*' Directory.Build.props | sed 's/<VersionPrefix>//')
          if [ "$prefix" != "${{ inputs.version }}" ]; then
            echo "Directory.Build.props says $prefix, the release input says ${{ inputs.version }}" >&2
            exit 1
          fi
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: enclave-helper
          path: enclave
      - name: Check the documentation set
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        # The release's documentation set must exist, hold every document the product declares, and match this build's
        # commands, API operations and record types before any draft is created; every gap is listed at once. The shipped
        # command line checks the set; the build tooling (not shipped) compares it with the build it documents.
        run: |
          set -eu
          dotnet run --configuration Release --project src/Vericairn.Cli -- docs check "docs/releases/$VERSION" --documents docs/releases/documents.json
          dotnet run --configuration Release --project tools/Vericairn.DocsTool -- compare "docs/releases/$VERSION"
      - name: Pack Community NuGet packages
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        # Pack before the RID-specific publishes: the tool is portable and the packages all carry the
        # checked release version. These exact files stay in the draft until the operator publishes it.
        run: |
          set -eu
          mkdir -p dist
          dotnet pack --no-restore --configuration Release --output dist \
            -p:Version="$VERSION" -p:VersionSuffix= -p:ContinuousIntegrationBuild=true
      - name: Publish self-contained distributables
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          mkdir -p dist
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
            dotnet publish src/Vericairn.Cli/Vericairn.Cli.csproj --configuration Release --runtime "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:VersionSuffix= -p:ContinuousIntegrationBuild=true -p:RestoreLockedMode=false \
              --output "out/$rid/bin" --nologo --verbosity quiet
            rm -f "out/$rid/bin/"*.pdb "out/$rid/bin/"*.xml
            # On macOS the Secure Enclave helper ships beside the command line, which calls it for enclave custody.
            case "$rid" in
              osx-*) install -m 0755 "enclave/$rid/vericairn-enclave" "out/$rid/bin/vericairn-enclave" ;;
            esac
            cp LICENSE NOTICE THIRD-PARTY-NOTICES.md "out/$rid/"
            # The license and notice texts of every component the command line bundles (THIRD-PARTY-NOTICES.md lists them).
            mkdir -p "out/$rid/licenses"
            cp licenses/*.txt "out/$rid/licenses/"
            test -s "out/$rid/licenses/dotnet-LICENSE.txt" && test -s "out/$rid/licenses/Apache-2.0.txt"
            case "$rid" in
              win-*) (cd "out/$rid" && zip -q -X -r "../../dist/vericairn-$VERSION-$rid.zip" .) ;;
              *) tar -C "out/$rid" -czf "dist/vericairn-$VERSION-$rid.tar.gz" . ;;
            esac
          done
          # Runtime-specific restores rewrite the lock files in the working tree; the repository's lock files are the truth.
          git checkout -- $(git ls-files '*packages.lock.json')
      - name: Publish Workbench distributables
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        # The desktop ships per platform as an unsigned developer build beside the command line it drives (Workbench finds
        # vericairn next to its own executable); no bundle, installer or signature yet, as the platform obligations record.
        run: |
          set -eu
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64; do
            dotnet publish src/Vericairn.Workbench/Vericairn.Workbench.csproj --configuration Release --runtime "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:VersionSuffix= -p:ContinuousIntegrationBuild=true -p:RestoreLockedMode=false \
              --output "out-workbench/$rid/bin" --nologo --verbosity quiet
            rm -f "out-workbench/$rid/bin/"*.pdb "out-workbench/$rid/bin/"*.xml
            cp "out/$rid/bin/"vericairn* "out-workbench/$rid/bin/"
            cp LICENSE NOTICE THIRD-PARTY-NOTICES.md "out-workbench/$rid/"
            # The fonts are embedded in the executable; the SIL Open Font License requires their copyright notices and license to
            # travel with every copy where the user can read them, so each archive carries the license texts under licenses/.
            mkdir -p "out-workbench/$rid/licenses"
            cp src/Vericairn.Workbench/Assets/Fonts/OFL-*.txt "out-workbench/$rid/licenses/"
            test -s "out-workbench/$rid/licenses/OFL-Inter.txt" && test -s "out-workbench/$rid/licenses/OFL-JetBrainsMono.txt"
            # Workbench holds a copy of the command line, so its archive carries the command line's license texts and its own.
            cp licenses/*.txt licenses/workbench/*.txt "out-workbench/$rid/licenses/"
            test -s "out-workbench/$rid/licenses/MIT-AvaloniaUI.txt" && test -s "out-workbench/$rid/licenses/Skia-HarfBuzz-THIRD-PARTY-NOTICES.txt"
            case "$rid" in
              win-*) (cd "out-workbench/$rid" && zip -q -X -r "../../dist/vericairn-workbench-$VERSION-$rid.zip" .) ;;
              *) tar -C "out-workbench/$rid" -czf "dist/vericairn-workbench-$VERSION-$rid.tar.gz" . ;;
            esac
          done
          git checkout -- $(git ls-files '*packages.lock.json')
      - name: Software bill of materials
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          dotnet tool install --global CycloneDX
          dotnet CycloneDX Vericairn.slnx --output sbom --json --exclude-test-projects
          cp sbom/bom.json "dist/vericairn-$VERSION-sbom.cdx.json"
          cp THIRD-PARTY-NOTICES.md "dist/vericairn-$VERSION-THIRD-PARTY-NOTICES.md"
      - name: Documentation set
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          (cd docs/releases && zip -q -X -r "../../dist/vericairn-$VERSION-docs.zip" "$VERSION")
      - name: Retain and verify readable build reports
        shell: bash
        run: |
          set -eu
          dotnet run --no-restore --configuration Release --project tools/Vericairn.DocsTool -- generate --out artifacts/release-companions --documents docs/releases/documents.json --artifacts dist
          dotnet run --no-build --configuration Release --project tools/Vericairn.DocsTool -- compare artifacts/release-companions --artifacts dist
      - name: Checksums and notes
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
          # The record formats this build reads and writes, as the documentation set's manifest states them from the build (the
          # comparison above refused a manifest that states others); the release observer reads the same manifest from the draft.
          formats=$(jq -r '"reads " + (.recordFormat.reads | map(tostring) | join(", ")) + ", writes " + (.recordFormat.writes | tostring)' "docs/releases/$VERSION/manifest.json")
          {
            echo "Vericairn $VERSION (unsigned developer build)"
            echo
            echo "Commit: ${{ github.sha }}"
            echo "Evidence: workflow run ${{ github.run_id }} built and tested on ubuntu-latest, macos-latest and windows-latest."
            echo "Record format: $formats."
            echo "Signing: none yet; this is an unsigned developer build. Verify the SHA256SUMS against the estate's manifest, never against the tag alone."
            echo
            echo "Distributables are self-contained per platform: unpack and run bin/vericairn (bin/vericairn.exe on Windows)."
            echo "NuGet packages and portable symbol packages are attached under SHA256SUMS. Publishing this draft triggers nuget.yml to verify and push these exact files through Trusted Publishing; it never rebuilds them."
            echo "After package publication, install the CLI with dotnet tool install --global dotnet-vc and invoke dotnet vc; install the SDK with dotnet add package Vericairn."
            echo "Workbench, the desktop, is vericairn-workbench-$VERSION-<platform>: unpack and run bin/vericairn-workbench beside the bin/vericairn it drives; an unsigned developer build with no bundle or installer, qualified only where the platform obligations say."
            echo
            echo "Documentation: vericairn-$VERSION-docs.zip is this release's documentation set (docs/releases/$VERSION in the repository): overview, installation and cold start, the operator's journeys, the command-line, API and record references, release notes and known limitations."
          } > dist/NOTES.md
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vericairn-${{ inputs.version }}
          path: dist
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        # Every asset is named once (a pattern that also matched the documentation archive once uploaded it twice and the
        # upload was refused). A draft of the same version left by an earlier failed run of this workflow is replaced, so
        # the observed draft is always the one this run built; a published release is never touched, and a corrective
        # release is a new version.
        run: |
          set -eu
          earlier=$(gh release view "v$VERSION" --json isDraft -q 'select(.isDraft) | "draft"' 2>/dev/null || true)
          if [ "$earlier" = "draft" ]; then
            echo "replacing the draft v$VERSION left by an earlier run of this workflow"
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft --title "Vericairn $VERSION" --notes-file dist/NOTES.md --target "${{ github.sha }}" \
            dist/vericairn-$VERSION-linux-x64.tar.gz dist/vericairn-$VERSION-linux-arm64.tar.gz dist/vericairn-$VERSION-osx-x64.tar.gz dist/vericairn-$VERSION-osx-arm64.tar.gz \
            dist/vericairn-$VERSION-win-x64.zip dist/vericairn-$VERSION-win-arm64.zip \
            dist/vericairn-workbench-$VERSION-linux-x64.tar.gz dist/vericairn-workbench-$VERSION-linux-arm64.tar.gz dist/vericairn-workbench-$VERSION-osx-x64.tar.gz dist/vericairn-workbench-$VERSION-osx-arm64.tar.gz \
            dist/vericairn-workbench-$VERSION-win-x64.zip dist/vericairn-workbench-$VERSION-win-arm64.zip \
            dist/vericairn-$VERSION-sbom.cdx.json dist/vericairn-$VERSION-THIRD-PARTY-NOTICES.md dist/vericairn-$VERSION-docs.zip \
            dist/*.nupkg dist/*.snupkg dist/SHA256SUMS
