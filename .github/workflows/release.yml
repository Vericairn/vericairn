name: release

# Builds a release candidate from an exact commit: the three-platform test matrix is the evidence, the
# archives are self-contained per platform, NuGet packages are framework-dependent, and a software bill
# of materials and the notices travel with them. package.yml, which ci.yml also runs on every change,
# builds them; everything lands in a DRAFT GitHub release under SHA256SUMS. Publishing the draft is the operator's reserved action after acceptance in the estate;
# only nuget.yml, triggered by that publication, pushes the package assets to NuGet.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (must equal VersionPrefix in Directory.Build.props)
        required: true

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        share: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --no-restore --configuration Release
      - name: Verify retained companion inputs and bytes
        if: matrix.share == 1
        run: python tests/companion-build.py
      - name: Build the Secure Enclave helper
        # The release's own test run exercises real key custody on every platform it qualifies. Unlike continuous integration, it
        # requires the Apple-silicon runner's Secure Enclave: the helper must find one, and the enclave tests fail rather than skip
        # (VERICAIRN_EXPECT_ENCLAVE), so the run's success means the store's test made, signed with and removed a real enclave key
        # (one without presence, so nothing waits for a person).
        if: runner.os == 'macOS'
        run: |
          set -eu
          mkdir -p artifacts/enclave
          swiftc -O -o artifacts/enclave/vericairn-enclave src/Vericairn.Enclave/vericairn-enclave.swift
          artifacts/enclave/vericairn-enclave available
          echo "VERICAIRN_ENCLAVE_HELPER=$PWD/artifacts/enclave/vericairn-enclave" >> "$GITHUB_ENV"
          echo "VERICAIRN_EXPECT_ENCLAVE=1" >> "$GITHUB_ENV"
      - name: Install a secret service
        # GNOME Keyring and secret-tool, so the Linux tests run the secret-service store in a D-Bus session with a keyring
        # unlocked by a throwaway password.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gnome-keyring libsecret-tools dbus-daemon
      - name: Test
        if: runner.os != 'Linux'
        # Each failed test is retried once and reported in the run's summary; a second failure fails the job.
        run: python .github/scripts/run-tests.py --share ${{ matrix.share }}
      - name: Test, with a secret service
        if: runner.os == 'Linux'
        env:
          VERICAIRN_EXPECT_SECRET_SERVICE: "1"
        run: |
          dbus-run-session -- bash -c '
            set -eu
            printf throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            printf probe | secret-tool store --label "Vericairn release probe" application vericairn-ci probe 1
            test "$(secret-tool lookup application vericairn-ci probe 1)" = probe
            python3 .github/scripts/run-tests.py --share ${{ matrix.share }}'

  package:
    # The packaging path ci.yml runs on every change, here for the version being released, once every platform and share has passed.
    needs: [verify]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ inputs.version }}
      release: true

  draft:
    # The only job that writes: it holds the token for creating the draft and checks nothing out.
    needs: [package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: vericairn-${{ needs.package.outputs.version }}
          path: dist
      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.package.outputs.version }}
          COMMIT: ${{ github.sha }}
        # Every asset is named once (a pattern that also matched the documentation archive once uploaded it twice and the upload was
        # refused). A draft of the same version left by an earlier failed run of this workflow is replaced, so the observed draft is
        # always the one this run built; a published release is never touched, and a corrective release is a new version.
        run: |
          set -eu
          earlier=$(gh release view "v$VERSION" --json isDraft -q 'select(.isDraft) | "draft"' 2>/dev/null || true)
          if [ "$earlier" = "draft" ]; then
            echo "replacing the draft v$VERSION left by an earlier run of this workflow"
            gh release delete "v$VERSION" --yes
          fi
          gh release create "v$VERSION" --draft --title "Vericairn $VERSION" --notes-file dist/NOTES.md --target "$COMMIT" \
            dist/vericairn-$VERSION-linux-x64.tar.gz dist/vericairn-$VERSION-linux-arm64.tar.gz dist/vericairn-$VERSION-osx-x64.tar.gz dist/vericairn-$VERSION-osx-arm64.tar.gz \
            dist/vericairn-$VERSION-win-x64.zip dist/vericairn-$VERSION-win-arm64.zip \
            dist/vericairn-workbench-$VERSION-linux-x64.tar.gz dist/vericairn-workbench-$VERSION-linux-arm64.tar.gz dist/vericairn-workbench-$VERSION-osx-x64.tar.gz dist/vericairn-workbench-$VERSION-osx-arm64.tar.gz \
            dist/vericairn-workbench-$VERSION-win-x64.zip dist/vericairn-workbench-$VERSION-win-arm64.zip \
            dist/vericairn-$VERSION-sbom.cdx.json dist/vericairn-$VERSION-THIRD-PARTY-NOTICES.md dist/vericairn-$VERSION-docs.zip \
            dist/*.nupkg dist/*.snupkg dist/SHA256SUMS
