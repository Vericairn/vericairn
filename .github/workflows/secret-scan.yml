name: secret-scan

# The estate's repository map asks for a secret scan before every push to a public repository (rule 6). A branch pushed to
# a public repository is visible at once, so this workflow scans the commits of every branch push, pull request and
# manual run, apart from the build in ci.yml, whose pushes run on all three platforms and only for main.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    # gitleaks scans the commits this event brings and fails on any finding, every secret redacted from the log. It runs
    # gitleaks' own release, pinned by version and by the SHA-256 that the release's checksums file gives for the Linux
    # archive, rather than gitleaks-action, which needs a license key for an organization, and it uses no secret. A push
    # that deletes a branch brings nothing to scan.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      # gitleaks_8.30.1_linux_x64.tar.gz, as gitleaks_8.30.1_checksums.txt of the release lists it.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The whole history, so the event's range can be read; no token is left in the clone the scanner reads.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          "$dir/gitleaks" version
      - name: Scan the commits this event brings
        # A pull request's commits. A push's range; for a new branch, or one whose previous tip the clone no longer holds,
        # the branch's commits that the default branch lacks, and the whole history when that branch is the default one.
        # The whole history for a manual run. gitleaks reports no leaks when git cannot read its range, so the range is
        # counted first: an unreadable one fails here, and so does an empty one, except for a push, which may bring no new
        # commit. gitleaks takes a .gitleaks.toml and a .gitleaksignore from the directory it scans and from its ignore
        # path, and honors gitleaks:allow comments, all of which the scanned commits could carry; so it scans the git
        # directory, where neither file can be committed, with an ignore path that holds none, and ignores those comments.
        # A finding is classified in the estate, never silenced here.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push)
              if git cat-file -e "$PUSH_BEFORE^{commit}" 2> /dev/null; then range="$PUSH_BEFORE..$PUSH_AFTER"
              elif [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then range=--all
              else range="origin/$DEFAULT_BRANCH..$PUSH_AFTER"
              fi ;;
            *) range=--all ;;
          esac
          count=$(git rev-list --count "$range")
          if [ "$count" -eq 0 ]; then
            if [ "$EVENT" = push ]; then
              echo "$range holds no commits: the push brings none that is new."
              exit 0
            fi
            echo "$range holds no commits, so the scan would read nothing." >&2
            exit 1
          fi
          echo "Scanning $count commits: $range"
          "$RUNNER_TEMP/gitleaks/gitleaks" detect --source .git --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks" --ignore-gitleaks-allow \
            --redact --verbose --no-banner --log-opts="$range"
