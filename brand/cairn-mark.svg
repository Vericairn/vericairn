<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Vericairn mark">
  <!-- The cairn: four stacked stones, offset as a hand would leave them, drawn as geometry. Single color: currentColor. -->
  <rect x="9" y="46" width="46" height="10" rx="3.5" fill="currentColor"/>
  <rect x="17" y="33" width="34" height="10" rx="3.5" fill="currentColor"/>
  <rect x="13" y="20" width="30" height="10" rx="3.5" fill="currentColor"/>
  <rect x="24" y="8" width="18" height="9" rx="3.5" fill="currentColor"/>
</svg>
